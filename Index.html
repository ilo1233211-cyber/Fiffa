<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Chibi Football - Fixed Physics</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; user-select: none; touch-action: none; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: white; font-size: 24px; font-weight: bold; pointer-events: none; z-index: 10; text-shadow: 2px 2px 5px #000; }
        #joystick-container { position: absolute; bottom: 30px; left: 30px; width: 80px; height: 80px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid #fff; z-index: 20; }
        #knob { position: absolute; top: 20px; left: 20px; width: 40px; height: 40px; background: #fff; border-radius: 50%; pointer-events: none; }
        #shoot-btn { position: absolute; bottom: 40px; right: 40px; width: 75px; height: 75px; background: rgba(220,20,60,0.8); border: 3px solid #fff; border-radius: 50%; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; z-index: 20; font-size: 14px; }
    </style>
</head>
<body>
    <div id="ui">YOU <span id="p1">0</span> - <span id="p2">0</span> AI</div>
    <div id="joystick-container"><div id="knob"></div></div>
    <div id="shoot-btn">SHOOT</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const sun = new THREE.DirectionalLight(0xffffff, 1.5);
        sun.position.set(10, 20, 10);
        scene.add(sun, new THREE.AmbientLight(0xffffff, 0.5));

        // Pitch & Stadium
        const PITCH_W = 30, PITCH_H = 50;
        const pitch = new THREE.Mesh(new THREE.PlaneGeometry(PITCH_W, PITCH_H), new THREE.MeshPhongMaterial({ color: 0x388e3c }));
        pitch.rotation.x = -Math.PI / 2;
        scene.add(pitch);

        function createFence(w, h, d, x, z) {
            const f = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshPhongMaterial({ color: 0xffffff }));
            f.position.set(x, h/2, z); scene.add(f);
        }
        createFence(1, 2, 50, -15.5, 0); createFence(1, 2, 50, 15.5, 0); // Sides
        createFence(11, 2, 1, -10, 25.5); createFence(11, 2, 1, 10, 25.5); // Back
        createFence(11, 2, 1, -10, -25.5); createFence(11, 2, 1, 10, -25.5);

        function createGoal(zPos) {
            const g = new THREE.Group();
            const mat = new THREE.MeshPhongMaterial({ color: 0xffffff });
            const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,3), mat); p1.position.set(-4, 1.5, 0);
            const p2 = p1.clone(); p2.position.set(4, 1.5, 0);
            const cross = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 8), mat);
            cross.rotation.z = Math.PI/2; cross.position.y = 3;
            g.add(p1, p2, cross); g.position.z = zPos; return g;
        }
        scene.add(createGoal(-25), createGoal(25));

        function createChibi(color) {
            const g = new THREE.Group();
            const h = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshPhongMaterial({color: 0xffdbac}));
            h.position.y = 1.9;
            const b = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 0.8), new THREE.MeshPhongMaterial({color: color}));
            b.position.y = 1;
            const legGeo = new THREE.BoxGeometry(0.25, 0.5, 0.25);
            const legMat = new THREE.MeshPhongMaterial({color: 0xffffff});
            const lLeg = new THREE.Mesh(legGeo, legMat); lLeg.position.set(-0.2, 0.25, 0);
            const rLeg = new THREE.Mesh(legGeo, legMat); rLeg.position.set(0.2, 0.25, 0);
            g.add(h, b, lLeg, rLeg);
            g.lLeg = lLeg; g.rLeg = rLeg;
            return g;
        }

        const ball = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), new THREE.MeshPhongMaterial({color: 0xffffff}));
        ball.position.y = 0.5; scene.add(ball);

        const player = createChibi(0x0000ff); player.position.set(0, 0, 12); scene.add(player);
        const opponent = createChibi(0xf44336); opponent.position.set(0, 0, -12); scene.add(opponent);
        const gkAI = createChibi(0x4caf50); gkAI.position.z = -23.8; scene.add(gkAI);
        const gkPlayer = createChibi(0xffeb3b); gkPlayer.position.z = 23.8; scene.add(gkPlayer);

        let moveDir = { x: 0, z: 0 }, ballVel = { x: 0, z: 0 }, scores = { p1: 0, p2: 0 };
        const knob = document.getElementById('knob');

        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const rect = document.getElementById('joystick-container').getBoundingClientRect();
            if (touch.clientX < window.innerWidth/2) {
                const dx = touch.clientX - (rect.left + 40);
                const dy = touch.clientY - (rect.top + 40);
                const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
                const angle = Math.atan2(dy, dx);
                moveDir.x = Math.cos(angle) * (dist / 40);
                moveDir.z = Math.sin(angle) * (dist / 40);
                knob.style.transform = `translate(${moveDir.x * 40}px, ${moveDir.z * 40}px)`;
            }
        });
        document.addEventListener('touchend', () => { moveDir = {x:0, z:0}; knob.style.transform = 'translate(0,0)'; });

        // SHOT POWER REDUCED
        document.getElementById('shoot-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (player.position.distanceTo(ball.position) < 2.2) {
                const dx = ball.position.x - player.position.x;
                const dz = ball.position.z - player.position.z;
                const mag = Math.sqrt(dx*dx + dz*dz) || 1;
                ballVel.x = (dx/mag) * 1.4; // Reduced from 2.5
                ballVel.z = (dz/mag) * 1.4;
            }
        });

        function animateLegs(p, speed) {
            const time = Date.now() * 0.01;
            if (speed > 0.05) {
                p.lLeg.position.y = 0.25 + Math.abs(Math.sin(time)) * 0.2;
                p.rLeg.position.y = 0.25 + Math.abs(Math.cos(time)) * 0.2;
            } else {
                p.lLeg.position.y = p.rLeg.position.y = 0.25;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            player.position.x += moveDir.x * 0.26;
            player.position.z += moveDir.z * 0.26;
            animateLegs(player, Math.sqrt(moveDir.x**2 + moveDir.z**2));

            // AI
            const dist = opponent.position.distanceTo(ball.position);
            if (dist > 1.2) {
                const angle = Math.atan2(ball.position.z - opponent.position.z, ball.position.x - opponent.position.x);
                opponent.position.x += Math.cos(angle) * 0.14;
                opponent.position.z += Math.sin(angle) * 0.14;
                animateLegs(opponent, 0.14);
            } else {
                opponent.position.z += 0.12;
                animateLegs(opponent, 0.12);
            }

            // Ball Physics
            ball.position.x += ballVel.x; ball.position.z += ballVel.z;
            ballVel.x *= 0.94; ballVel.z *= 0.94;

            // FENCE FIX: Instant bounce and push-back
            if (ball.position.x < -14.5) { ball.position.x = -14.4; ballVel.x *= -0.6; }
            if (ball.position.x > 14.5) { ball.position.x = 14.4; ballVel.x *= -0.6; }
            if (Math.abs(ball.position.x) > 4) {
                if (ball.position.z < -24.5) { ball.position.z = -24.4; ballVel.z *= -0.6; }
                if (ball.position.z > 24.5) { ball.position.z = 24.4; ballVel.z *= -0.6; }
            }

            // Collisions
            [player, opponent, gkAI, gkPlayer].forEach(p => {
                const d = p.position.distanceTo(ball.position);
                if (d < 1.4) {
                    const dx = (ball.position.x - p.position.x) / d;
                    const dz = (ball.position.z - p.position.z) / d;
                    ball.position.x += dx * (1.4 - d);
                    ball.position.z += dz * (1.4 - d);
                    ballVel.x += dx * 0.15; ballVel.z += dz * 0.15;
                }
                // Solid walls for players
                if (p.position.x < -14.5) p.position.x = -14.5;
                if (p.position.x > 14.5) p.position.x = 14.5;
            });

            if (Math.abs(ball.position.x) < 4 && ball.position.z < -25) { scores.p1++; reset(); }
            if (Math.abs(ball.position.x) < 4 && ball.position.z > 25) { scores.p2++; reset(); }

            function reset() { 
                ball.position.set(0, 0.5, 0); ballVel = {x:0, z:0};
                player.position.set(0, 0, 12); opponent.position.set(0, 0, -12);
                document.getElementById('p1').innerText = scores.p1;
                document.getElementById('p2').innerText = scores.p2;
            }

            camera.position.lerp(new THREE.Vector3(player.position.x, 10, player.position.z + 14), 0.1);
            camera.lookAt(player.position.x, 0, player.position.z - 3);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
